[package]
name = "netch-desktop"
version = "0.1.0"
description = "Modern desktop shell for the Netch modernization fork"
authors = ["Netch contributors and fork contributors"]
edition = "2024"
license = "GPL-3.0-only"

[features]
elevated = []

[lib]
name = "netch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
