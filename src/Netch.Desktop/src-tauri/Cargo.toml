[package]
name = "netf-desktop"
version = "0.1.0"
description = "NetF desktop client, a modernized fork of Netch"
authors = ["Netch contributors and fork contributors"]
edition = "2024"
license = "GPL-3.0-only"

[features]
elevated = []

[lib]
name = "netf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
